[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-intent"
version = "0.1.0"
description = "Score phone numbers P1-P4 by how likely a real person picks up, from your own call log"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["lightgbm>=4.0", "pandas>=2.0", "numpy>=1.24", "phonenumbers>=8.13", "tzdata"]

[project.scripts]
phone-intent = "phone_intent.cli:main"

[tool.setuptools]
packages = ["phone_intent"]

[tool.setuptools.package-data]
phone_intent = ["models/*.txt", "models/*.json", "models/carrier/*.txt", "models/carrier/*.json"]
